server {
    listen 80;
    server_name _;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://domains-api.lisaos.dev; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Pure static SPA. All /api calls from Landing.vue go directly to
    # https://domains-api.lisaos.dev (cross-origin) — no proxy here to
    # maintain. See api/domains ALLOWED_ORIGINS for CORS config.

    # SPA fallback — unknown paths serve index.html so vue-router owns
    # the URL surface (catch-all redirects old /dashboard etc. to /).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache on fingerprinted Vite bundles (hashed, content-addressable).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://domains-api.lisaos.dev; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
